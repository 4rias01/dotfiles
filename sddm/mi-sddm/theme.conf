[General]

# ATENCION: todo lo que pongas aca llega a QML como STRING.
# "56" es la cadena "56", no el numero 56. Por eso en el QML veras
# parseInt() y parseFloat() por todos lados. Es la trampa #1 al empezar.
#
# Las comillas son obligatorias en los colores: sin ellas el `#` se
# interpreta como comienzo de comentario.

# ─────────────── Resolucion de referencia ───────────────
# TODAS las medidas de este archivo estan escritas para esta resolucion
# ("pixeles de diseno"). Main.qml calcula
#
#     escala = min(anchoReal / designWidth, altoReal / designHeight)
#
# y multiplica cada medida por ella, asi el tema se ve igual en 1366x768,
# en 1080p o en 4K sin tocar un solo numero.
#
# Se usa el minimo de las dos razones (escalado "fit"): con la misma
# relacion de aspecto el resultado es proporcion exacta, y con una
# distinta manda el eje mas ajustado, asi nada se sale de pantalla.
#
# No hace falta que coincida con tu monitor: es solo la regla con la que
# estan medidos los numeros de abajo. Cambiala unicamente si vas a
# reescribir todas las medidas contra otra referencia.
designWidth="1366"
designHeight="768"

# Multiplicador extra, por gusto. 1.1 = todo un 10% mas grande.
uiScale="1.0"

# ─────────────── Fondo ───────────────
# Ruta RELATIVA a la carpeta del tema.
background="Backgrounds/wallpaper.png"

# 0.0 = sin oscurecer, 1.0 = negro.
dimBackground="0.15"

# ─────────────── Posicion del formulario ───────────────
# left | center | right
formPosition="left"

# Distancia al borde de la pantalla. Solo aplica a left/right.
#
# Esta medida y blurWidth aceptan tambien PORCENTAJE de pantalla
# ("12%"). Si usas porcentaje, usalo en las dos: si una escala con la
# resolucion y la otra con el ancho, en un monitor ultrapanoramico el
# formulario se sale de la banda de blur.
formPadding="160"

# Ancho de la columna completa (reloj + campos + botones).
formWidth="340"

# ─────────────── Blur parcial ───────────────
partialBlur="true"

# Intensidad. OJO: FastBlur clampea el radio a 64, asi que este es el
# unico valor que NO escala sin techo. A partir de ~1080p ya esta en el
# maximo; como es un desenfoque fuerte, la diferencia no se nota.
blurRadius="56"

# Hasta donde ENTRA el blur desde el borde de la pantalla.
# 660 sobre los 1366 de referencia = casi la mitad, justo antes del
# personaje. Acepta porcentaje ("48%"), pero leete la nota de formPadding.
blurWidth="660"

# Alto de la banda. Con porcentaje >100% queda garantizado que llega de
# borde a borde en cualquier relacion de aspecto (con un numero fijo, en
# una pantalla 4:3 la escala la manda el ancho y la banda se quedaria
# corta arriba y abajo).
# Ponelo en "80%" si preferis una tarjeta con aire arriba y abajo.
blurHeight="120%"

# Redondeo de esquinas. 0 para banda, 24-32 para tarjeta.
blurCorner="0"

# Cuanto se desvanece el borde. 0 = canto nitido, 64 = maximo util.
# Tambien pasa por FastBlur, asi que tiene el mismo techo de 64.
blurEdgeSoftness="48"

# El blur se pega al canto de la pantalla, del mismo lado que el
# formulario. Ver el comentario del "sangrado" en Main.qml.
# Ponelo en "false" para una tarjeta flotante centrada en el formulario.
blurFlush="true"

# ─────────────── Escala ───────────────
# Todo en un solo lugar para poder cuadrar proporciones sin tocar QML.
#
# Las fuentes van en PIXELES, no en puntos: un punto es una medida fisica
# que Qt convierte usando los DPI de la pantalla, y como el tema ya escala
# por su cuenta el DPI se contaria dos veces. Regla rapida si venis de
# puntos: pixeles = puntos x 1.33.
clockSize="75"
dateSize="20"
fontSize="13"
fieldIconSize="16"
fieldHeight="42"
sysIconSize="21"
sysLabelSize="12"

# Espacio vertical entre los tres bloques.
gapClockForm="80"
gapFormSystem="56"

# ─────────────── Tipografia ───────────────
# Deben estar en /usr/share/fonts (el usuario sddm no lee tu $HOME).
font="JetBrainsMono Nerd Font"
iconFont="Symbols Nerd Font"

# ─────────────── Reloj ───────────────
# Sintaxis de Qt.formatDateTime: HH mm ss dddd d MMMM yyyy
hourFormat="HH:mm"
dateFormat="dddd d MMMM"

# ─────────────── Colores ───────────────
textColor="#ffffff"
accentColor="#b7cef1"
fieldColor="#2a2d3a"
fieldTextColor="#ffffff"
placeholderColor="#a0a4b8"
buttonColor="#343746"
buttonTextColor="#ffffff"
iconColor="#f8f8f2"
warningColor="#e78284"

# ─────────────── Desarrollo ───────────────
# En --test-mode sddm.canPowerOff y compania suelen ser false, asi que
# los botones de sistema desaparecen. Volvelo a "false" antes de usarlo
# en serio, para que solo se vean las acciones que tu sistema permite.
forceSystemButtons="true"
