##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

xwayland {
    force_zero_scaling = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule = opacity 1.0 override 1.0 override, match:class (firefox|brave-browser|zen)
windowrule = opacity 1.0 override 1.0 override, match:class code
windowrule = opacity 1.0 override 1.0 override, match:class spotify
windowrule = opacity 0.9 override 0.9 override, match:class waypaper
windowrule = opacity 0.9 override 0.9 override, match:class zoom

# Juegos Steam (XWayland)
windowrule = opacity 1.0 override 1.0 override, match:class ^steam_app_.*$
