# 🛠️  Architected by L€yzS
# 🔐  Vertical Clock Design & Profile Image Integration.

# BACKGROUND 
background {
    monitor =
    path = $HOME/.cache/quickshell-wallpaper/current_symlink
    blur_passes = 2
    contrast = 1.0
    brightness = 0.9
    crossfade_time = 0.5
}

# VERTICAL CLOCK (UPPER - HOUR)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 80
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 230
    halign = center
    valign = center
}

# VERTICAL CLOCK (LOWER - MINUTE)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 80
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 115
    halign = center
    valign = center
}

# CALENDAR
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %b")"
    color = rgba(255, 255, 255, 0.6)
    font_size = 13
    font_family = JetBrains Mono Nerd Font
    position = 0, 35
    halign = center
    valign = center
}

# PROFILE IMAGE
image {
    monitor =
   
    # =========================================================================================
    # AUTOMATIC PROFILE PICTURE:
    # Go to the 'Hyprlock-Pfp' folder in your Home directory and place your image there.
    # IMPORTANT: Just rename your file to 'picture.png' (or update below if using .jpg).
    # =========================================================================================
    path = ~/.config/hypr/profile.jpg
        
    size = 130
    rounding = -1 # [TR] Tam yuvarlak / [EN] Perfect circle
    border_size = 4
    border_color = rgb(255, 255, 255)
    position = 0, 160
    halign = center
    valign = bottom
}

# INPUT FIELD 
input-field {
    monitor =
    size = 210, 40
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Password...</span>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# ANIMATIONS
animations {
    enabled = true
    bezier = easeInOut, 0.42, 0, 0.58, 1
    bezier = easeOut,   0,    0, 0.58, 1

    animation = fadeIn,  1, 4, easeOut
    animation = fadeOut, 1, 3, easeInOut
    animation = inputFieldColors, 1, 3, easeInOut
    animation = inputFieldWidth,  1, 3, easeInOut
    animation = inputFieldDots,   1, 2, easeOut
}
