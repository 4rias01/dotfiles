$font = Monospace

general {
	hide_cursor = true
}

animations {
	enabled = true
	bezier = linear, 1, 1, 0, 0
	animation = fadeIn, 1, 5, linear
	animation = fadeOut, 1, 5, linear
	animation = inputFieldDots, 1, 2, linear
}

background {
	monitor =
	path = /home/santiagoar/Wallpapers/chainsaw/makima1.jpg
	blur_passes = 0
	blur_size = 0
}

input-field {
	monitor = 
	size = 20%, 5%
	# outline_thickness = 3
	# inner_color = rgba(e6394666)

	# outer_color = rgba(dc143cff)
	check_color = rgba(00ff00ff) rgba(a3e635ff) 120deg
	fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

	# font_color
	fade_on_empty = false	
	# roundin = 15

	font_family = &font
	placeholder_text = <i>Password</i>
	fail_text = $PAMFAIL

	# uncomment to use a letter instead of a dot to indicate the typed password
	# dots_text_format = *
	# dots_size = 0.4
	dots_spacing = 0.3

	# uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
	# hide_input = true

	# position = 0, -20
	halign = center
	valign = center

	dots_center = true
}

# TIME 
label {
	monitor = 
	# text = cmd[update:1000] date +"%H:%M"
	text = $TIME	
	font_size = 80
	font_family = $font

	position = 30, 0
	halign = left
	valign = top
}

#DATE 
label {
	monitor = 
	text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
	font_size = 25
	font_family = $font

	position = 30, -150
	halign = left
	valign = top
}
