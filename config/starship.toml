format = """
[](#0040bd)\
$username\
[](bg:#205af8 fg:#0040bd)\
$directory\
[](fg:#205af8 bg:#0040bd)\
$git_branch\
$git_status\
[](fg:#0040bd bg:#004cdd)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#004cdd bg:#00349d)\
$time\
[ ](fg:#00349d)\
\n$character"""

[username]
show_always = true
style_user = "fg:#ffffff bg:#0040bd"
style_root = "fg:#ffffff bg:#0040bd"
format = "[ $user ]($style)"

[directory]
style = "fg:#ffffff bg:#205af8"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documentos" = "󰈙 "
"Descargas" = " "
"Music" = " "
"Imágenes" = " "
"~" = "󰓎 "
"home" = " "

[git_branch]
symbol = " "
style = "bg:#0040bd"
format = '[[ $symbol $branch ](fg:#ffffff bg:#0040bd)]($style)'

[git_status]
style = "bg:#0040bd"
format = '[[($all_status$ahead_behind )](fg:#ffffff bg:#0040bd)]($style)'

[nodejs]
symbol = ""
style = "bg:#004cdd"
format = '[[ $symbol ($version) ](fg:#004cdd bg:#004cdd)]($style)'

[rust]
symbol = ""
style = "bg:#004cdd"
format = '[[ $symbol ($version) ](fg:#004cdd bg:#004cdd)]($style)'

[golang]
symbol = ""
style = "bg:#004cdd"
format = '[[ $symbol ($version) ](fg:#004cdd bg:#004cdd)]($style)'

[php]
symbol = ""
style = "bg:#004cdd"
format = '[[ $symbol ($version) ](fg:#004cdd bg:#004cdd)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#00349d"
format = '[[  $time ](fg:#ffffff bg:#00349d)]($style)'
