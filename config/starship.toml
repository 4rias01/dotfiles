format = """
[](#fa5a5e)\
$username\
[](bg:#cb2d3b fg:#fa5a5e)\ 
$directory\
[](fg:#cb2d3b bg:#b30c2a)\ 
$git_branch\
$git_status\
[](fg:#b30c2a bg:#e2444c)\ 
$nodejs\
$rust\
$golang\
$php\
[](fg:#e2444c bg:#740017)\
$time\
[ ](fg:#740017)\
\n$character"""

[username]
show_always = true
style_user = "fg:#ffffff bg:#fa5a5e"
style_root = "fg:#ffffff bg:#fa5a5e"
format = "[ $user ]($style)"

[directory]
style = "fg:#ffffff bg:#cb2d3b"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documentos" = "󰈙 "
"Descargas" = " "
"Music" = " "
"Imágenes" = " "
"~" = "󰓎 "
"home" = " "

[git_branch]
symbol = " "
style = "bg:#b30c2a"
format = '[[ $symbol $branch ](fg:#ffffff bg:#b30c2a)]($style)'

[git_status]
style = "bg:#b30c2a"
format = '[[($all_status$ahead_behind )](fg:#ffffff bg:#b30c2a)]($style)'

[nodejs]
symbol = ""
style = "bg:#e2444c"
format = '[[ $symbol ($version) ](fg:#e2444c bg:#e2444c)]($style)'

[rust]
symbol = ""
style = "bg:#e2444c"
format = '[[ $symbol ($version) ](fg:#e2444c bg:#e2444c)]($style)'

[golang]
symbol = ""
style = "bg:#e2444c"
format = '[[ $symbol ($version) ](fg:#e2444c bg:#e2444c)]($style)'

[php]
symbol = ""
style = "bg:#e2444c"
format = '[[ $symbol ($version) ](fg:#e2444c bg:#e2444c)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#740017"
format = '[[  $time ](fg:#ffffff bg:#740017)]($style)'
